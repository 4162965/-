<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>搜图工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* 自定义壁纸优先级更高：取消下面注释并替换URL，会覆盖渐变背景 */
    /* background: url("https://替换成你的壁纸链接.jpg") no-repeat center center; */
    /* background-size: cover; */
    /* 梦幻渐变背景（上一版UI） */
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fcb69f, #ffecd2, #a1c4fd, #c2e9fb);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    /* 壁纸/渐变遮罩（让内容更清晰） */
    position: relative;
  }
  
  /* 渐变流动动画 */
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  
  /* 遮罩层（调整0.85可改变透明度） */
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.85);
    z-index: -1;
  }

  .container {
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 35px 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.8);
  }

  h2 {
    font-size: 32px;
    font-weight: 800;
    color: #2d3748;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 14px;
    color: #718096;
    margin-bottom: 28px;
  }

  .input-wrapper {
    position: relative;
    margin-bottom: 16px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 18px 24px;
    font-size: 15px;
    border-radius: 30px;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(255,255,255,0.9);
    color: #2d3748;
    outline: none;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  }

  input:focus, select:focus {
    border-color: #a1c4fd;
    box-shadow: 0 0 0 3px rgba(161,196,253,0.25);
  }

  #keyword {
    padding-right: 90px;
  }

  .btn-translate {
    position: absolute;
    right: 8px;
    top: 8px;
    bottom: 8px;
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    color: white;
    border: none;
    border-radius: 25px;
    padding: 0 15px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .btn-translate:hover {
    opacity: 0.9;
    transform: scale(0.96);
  }

  .select-wrapper {
    position: relative;
    margin-bottom: 18px;
  }

  .select-wrapper::after {
    content: '▼';
    font-size: 10px;
    color: #718096;
    position: absolute;
    right: 22px;
    top: 40%;
    pointer-events: none;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
  }

  /* 按钮组 - 彩色渐变按键 */
  .button-group {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
  }

  button.action-btn {
    flex: 1;
    padding: 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    color: white;
  }

  /* 搜索按钮 - 主渐变 */
  .btn-primary {
    background: linear-gradient(135deg, #ff9a9e, #fcb69f);
    box-shadow: 0 4px 15px rgba(255,154,158,0.3);
  }

  /* 多站搜索按钮 - 辅助渐变 */
  .btn-secondary {
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
    box-shadow: 0 4px 15px rgba(161,196,253,0.3);
  }

  .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  /* 多站勾选区域 - 移到按钮下方 */
  .check-wrap {
    background: rgba(255,255,255,0.5);
    border-radius: 20px;
    padding: 15px;
    text-align: left;
    margin-bottom: 20px;
    border: 1px solid rgba(0,0,0,0.05);
  }

  .check-title {
    font-size: 12px;
    color: #718096;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .check-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .check-item {
    font-size: 12px;
    color: #4a5568;
    padding: 4px 8px;
    background: white;
    border-radius: 12px;
    border: 1px solid #eee;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .check-item input {
    width: 14px;
    height: 14px;
  }

  .btn-text {
    background: transparent;
    color: #718096;
    border: none;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 20px;
    text-decoration: underline;
  }

  #result {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #eee;
    padding: 12px 0;
    text-align: center;
    font-size: 12px;
    color: #999;
    margin-bottom: 25px;
  }

  /* 历史记录 */
  .history-section {
    border-top: 1px solid #eee;
    padding-top: 20px;
    text-align: left;
  }

  .history-title {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #718096;
    margin-bottom: 12px;
  }

  .clear-btn {
    background: none;
    border: none;
    color: #999;
    font-size: 12px;
    cursor: pointer;
  }

  .history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-tag {
    background: white;
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 12px;
    color: #4a5568;
    border: 1px solid #eee;
    cursor: pointer;
  }

  .empty-history {
    font-size: 12px;
    color: #bbb;
  }

  /* 移动端适配 */
  @media (max-width: 400px) {
    .container {
      padding: 25px 20px;
      border-radius: 25px;
    }
    h2 {
      font-size: 26px;
    }
    .button-group {
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h2>搜图工具</h2>
  <div class="subtitle">一键多平台图片灵感搜索</div>

  <div class="input-wrapper">
    <input type="text" id="keyword" placeholder="输入关键词，例如：风景 / 插画">
    <button class="btn-translate" onclick="translateKeyword()">中译英</button>
  </div>

  <div class="select-wrapper">
    <select id="engine">
      <option value="google">Google图片</option>
      <option value="pinterest">Pinterest</option>
      <option value="bing">必应</option>
      <option value="baidu">百度</option>
      <option value="sogou">搜狗</option>
      <option value="huaban">花瓣</option>
      <option value="quark">夸克</option>
      <option value="zcool">站酷</option>
      <option value="pixabay">Pixabay</option>
      <option value="so360">360图片</option>
      <option value="unsplash">Unsplash</option>
      <option value="pexels">Pexels</option>
      <option value="xiaohongshu">小红书</option>
    </select>
  </div>

  <!-- 按钮组（彩色渐变） -->
  <div class="button-group">
    <button class="action-btn btn-primary" onclick="search()">搜索</button>
    <button class="action-btn btn-secondary" onclick="searchAll()">多站点搜索</button>
  </div>

  <!-- 多站勾选区域（移到按钮下方） -->
  <div class="check-wrap">
    <div class="check-title">选择多站点搜索打开的网站</div>
    <div class="check-list" id="checkList"></div>
  </div>

  <button class="btn-text" onclick="copyLink()">复制直达链接</button>
  <input type="text" id="result" readonly placeholder="搜索链接将显示在这里">

  <div class="history-section">
    <div class="history-title">
      <span>搜索记录</span>
      <button class="clear-btn" onclick="clearHistory()">清空</button>
    </div>
    <div id="history-tags" class="history-tags"></div>
  </div>
</div>

<script>
const engines = {
  google:"Google图片",pinterest:"Pinterest",xiaohongshu:"小红书",bing:"必应",
  baidu:"百度",sogou:"搜狗",huaban:"花瓣",quark:"夸克",zcool:"站酷",
  pixabay:"Pixabay",so360:"360图片",unsplash:"Unsplash",pexels:"Pexels"
};
const engineUrl = {
  google:"https://www.google.com/search?tbm=isch&q=（关键词）",
  pinterest:"https://www.pinterest.com/search/pins/?q=（关键词）",
  xiaohongshu:"https://www.xiaohongshu.com/search_result?keyword=（关键词）",
  bing:"https://www.bing.com/images/search?q=（关键词）",
  baidu:"https://image.baidu.com/search/index?tn=baiduimage&word=（关键词）",
  sogou:"https://pic.sogou.com/pics?query=（关键词）",
  huaban:"https://huaban.com/search?q=（关键词）",
  quark:"https://quark.sm.cn/s?q=（关键词）",
  zcool:"https://www.zcool.com.cn/search/content?word=（关键词）",
  pixabay:"https://pixabay.com/zh/images/search/（关键词）/",
  so360:"https://image.so.com/i?q=（关键词）",
  unsplash:"https://unsplash.com/s/photos/（关键词）",
  pexels:"https://www.pexels.com/zh-cn/search/（关键词）/"
};

// 勾选状态记忆
function saveChecked(a){localStorage.setItem("s",JSON.stringify(a))}
function getChecked(){let d=localStorage.getItem("s");return d?JSON.parse(d):[]}

function renderCheck(){
  let list=document.getElementById("checkList");
  list.innerHTML="";
  let c=getChecked();
  Object.keys(engines).forEach(k=>{
    let l=document.createElement("label");
    l.className="check-item";
    l.innerHTML=`<input type="checkbox" value="${k}"> ${engines[k]}`;
    let i=l.querySelector("input");
    i.checked=c.includes(k);
    i.onchange=()=>{
      let all=Array.from(document.querySelectorAll(".check-item input:checked")).map(e=>e.value);
      saveChecked(all);
    };
    list.appendChild(l);
  })
}

// 翻译功能
async function translateKeyword(){
  let v=document.getElementById("keyword").value.trim();
  if(!v){alert("请输入内容");return}
  let b=document.querySelector(".btn-translate");
  let t=b.innerText;
  b.innerText="翻译中…";b.disabled=1;
  try{
    let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(v)}&langpair=zh|en`);
    let d=await r.json();
    if(d?.responseData?.translatedText)document.getElementById("keyword").value=d.responseData.translatedText;
  }catch(e){alert("翻译失败")}
  b.innerText=t;b.disabled=0;
}

// 历史记录功能
function getHistory(){let h=localStorage.getItem("h");return h?JSON.parse(h):[]}
function saveHistory(k){if(!k)return;let a=getHistory();a=a.filter(i=>i!==k);a.unshift(k);if(a.length>10)a.pop();localStorage.setItem("h",JSON.stringify(a));renderHistory()}
function renderHistory(){let a=getHistory();let b=document.getElementById("history-tags");b.innerHTML="";if(a.length===0){b.innerHTML='<span class="empty-history">暂无记录</span>';return}a.forEach(k=>{let s=document.createElement("span");s.className="history-tag";s.innerText=k;s.onclick=()=>document.getElementById("keyword").value=k;b.appendChild(s)})}
function clearHistory(){localStorage.removeItem("h");renderHistory()}

// 搜索核心逻辑
function buildUrl(k){let w=document.getElementById("keyword").value.trim();return w?engineUrl[k].replace("（关键词）",encodeURIComponent(w)):""}
function search(){let u=buildUrl(document.getElementById("engine").value);if(u){saveHistory(document.getElementById("keyword").value);document.getElementById("result").value=u;window.open(u)}}
function searchAll(){let w=document.getElementById("keyword").value.trim();if(!w){alert("请输入关键词");return}let c=getChecked();if(c.length===0){alert("请勾选网站");return}saveHistory(w);c.forEach((e,i)=>{setTimeout(()=>{let u=buildUrl(e);if(u)window.open(u)},i*200)})}
function copyLink(){let u=buildUrl(document.getElementById("engine").value);if(u){document.getElementById("result").value=u;navigator.clipboard.writeText(u);alert("已复制")}}

// 页面初始化
window.onload=()=>{renderHistory();renderCheck();document.getElementById("keyword").addEventListener("keydown",e=>e.key==="Enter"&&search())}
</script>
</body>
</html>
