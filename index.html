<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>搜图工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 全局美化 */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #e8edf2 0%, #dfe6ee 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 卡片美化 磨砂质感 */
  .container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 36px;
    padding: 55px 45px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.08);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.6);
  }

  /* 标题美化 */
  h2 {
    font-size: 34px;
    font-weight: 800;
    color: #222;
    margin: 0 0 10px 0;
    letter-spacing: 0.5px;
  }
  .subtitle {
    font-size: 15px;
    color: #808892;
    margin-bottom: 45px;
  }

  /* 输入框容器 */
  .input-wrapper {
    position: relative;
    margin-bottom: 18px;
  }

  /* 输入框、下拉框统一美化 */
  input[type="text"], select {
    width: 100%;
    padding: 20px 26px;
    font-size: 15px;
    border-radius: 60px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    color: #222;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(0,0,0,0.03);
  }
  input[type="text"]:focus, select:focus {
    border-color: #b8c8dc;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }
  
  #keyword {
    padding-right: 95px;
  }

  /* 翻译按钮美化 */
  .btn-translate {
    position: absolute;
    right: 10px;
    top: 10px;
    bottom: 10px;
    background: #f1f5f9;
    border: none;
    border-radius: 50px;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 600;
    color: #475569;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-translate:hover {
    background: #e2e8f0;
    color: #1e293b;
  }
  .btn-translate:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  /* 下拉选择框美化 */
  .select-wrapper {
    position: relative;
    margin-bottom: 20px;
  }
  .select-wrapper::after {
    content: '▼';
    font-size: 11px;
    color: #a0aec0;
    position: absolute;
    right: 26px;
    top: 42%;
    pointer-events: none;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }

  /* 按钮组 */
  .button-group {
    display: flex;
    gap: 15px;
    margin-bottom: 18px;
  }
  button.action-btn {
    flex: 1;
    padding: 20px 24px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 60px;
    border: none;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #222 0%, #333 100%);
    color: #fff;
  }
  .btn-primary:hover {
    opacity: 0.92;
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.12);
  }
  .btn-secondary {
    background: #ffffff;
    color: #222;
    border: 1px solid #e2e8f0;
  }
  .btn-secondary:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.05);
  }
  
  .btn-text {
    background: transparent;
    color: #718096;
    font-weight: 500;
    font-size: 14px;
    padding: 10px;
    text-decoration: none;
    width: auto;
    border: none;
    cursor: pointer;
    margin-bottom: 22px;
    transition: color 0.2s;
  }
  .btn-text:hover {
    color: #222;
  }

  /* 结果链接框 */
  #result {
    background: transparent;
    border: none;
    border-bottom: 1px solid #dce3ec;
    border-radius: 0;
    padding: 14px 0;
    text-align: center;
    font-size: 13px;
    color: #8892a0;
    margin-bottom: 32px;
    box-shadow: none;
  }

  /* 历史记录区域 */
  .history-section {
    text-align: left;
    border-top: 1px solid #e2e8f0;
    padding-top: 26px;
  }
  .history-title {
    font-size: 13px;
    color: #718096;
    margin-bottom: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .clear-btn {
    background: none;
    color: #8892a0;
    border: none;
    padding: 0;
    margin: 0;
    width: auto;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    flex: none;
    font-weight: normal;
    transition: color 0.2s;
  }
  .clear-btn:hover {
    color: #222;
  }
  .history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .history-tag {
    background: #ffffff;
    color: #4a5568;
    padding: 9px 18px;
    border-radius: 50px;
    font-size: 13px;
    border: 1px solid #e2e8f0;
    cursor: pointer;
    transition: all 0.25s;
  }
  .history-tag:hover {
    border-color: #a0aec0;
    background: #f8fafc;
  }
  .empty-history {
    color: #b8c2cc;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="container">
  <h2>搜图工具</h2>
  <div class="subtitle">一键多平台图片灵感搜索工具</div>

  <div class="input-wrapper">
    <input type="text" id="keyword" placeholder="输入关键词，例如：景观设计 / 风景">
    <button class="btn-translate" onclick="translateKeyword()" id="translateBtn">中译英</button>
  </div>
  
  <div class="select-wrapper">
    <select id="engine">
      <option value="google">Google图片（推荐）</option>
      <option value="pinterest">Pinterest（灵感）</option>
      <option value="bing">必应 (Bing)</option>
      <option value="baidu">百度 (Baidu)</option>
      <option value="sogou">搜狗 (Sogou)</option>
      <option value="huaban">花瓣 (Huaban)</option>
      <option value="quark">夸克 (Quark)</option>
      <option value="wechat">微信 (WeChat)</option>
      <option value="zcool">站酷 (ZCOOL)</option>
      <option value="pixabay">Pixabay</option>
      <option value="miankoutupian">免扣图网</option>
      <option value="so360">360图片</option>
      <option value="unsplash">Unsplash</option>
      <option value="pexels">Pexels</option>
      <option value="cc0">CC零图片网</option>
      <option value="xiaohongshu">小红书 (Xiaohongshu)</option>
    </select>
  </div>

  <div class="button-group">
    <button class="action-btn btn-primary" onclick="search()">搜索</button>
    <button class="action-btn btn-secondary" onclick="searchAll()">多站点搜索</button>
  </div>
  
  <button class="btn-text" onclick="copyLink()">复制直达链接</button>

  <input type="text" id="result" placeholder="生成的搜索链接会显示在这里..." readonly>

  <div class="history-section">
    <div class="history-title">
      <span>搜索记录</span>
      <button class="clear-btn" onclick="clearHistory()">清空记录</button>
    </div>
    <div id="history-tags" class="history-tags">
    </div>
  </div>
</div>

<script>
const engines = {
  google: "https://www.google.com/search?tbm=isch&q=（关键词）",
  pinterest: "https://www.pinterest.com/search/pins/?q=（关键词）",
  xiaohongshu: "https://www.xiaohongshu.com/search_result?keyword=（关键词）",
  bing: "https://www.bing.com/images/search?q=（关键词）",
  baidu: "https://image.baidu.com/search/index?tn=baiduimage&word=（关键词）",
  sogou: "https://pic.sogou.com/pics?query=（关键词）",
  huaban: "https://huaban.com/search?q=（关键词）",
  quark: "https://quark.sm.cn/s?q=（关键词）",
  wechat: "https://weixin.sogou.com/weixin?type=2&query=（关键词）",
  zcool: "https://www.zcool.com.cn/search/content?word=（关键词）",
  pixabay: "https://pixabay.com/zh/images/search/（关键词）/",
  miankoutupian: "https://miankoutupian.com/?s=（关键词）",
  so360: "https://image.so.com/i?q=（关键词）",
  unsplash: "https://unsplash.com/s/photos/（关键词）",
  pexels: "https://www.pexels.com/zh-cn/search/（关键词）/",
  cc0: "https://cc0.cn/?s=（关键词）"
};

// 翻译
async function translateKeyword() {
  const inputEl = document.getElementById("keyword");
  const btnEl = document.getElementById("translateBtn");
  const text = inputEl.value.trim();

  if (!text) {
    alert("请先输入需要翻译的中文！");
    return;
  }

  const originalText = btnEl.innerText;
  btnEl.innerText = "翻译中...";
  btnEl.disabled = true;

  try {
    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|en`);
    const data = await response.json();
    
    if (data && data.responseData && data.responseData.translatedText) {
      inputEl.value = data.responseData.translatedText;
    } else {
      alert("翻译服务返回异常，请重试。");
    }
  } catch (error) {
    console.error("翻译出错:", error);
    alert("网络或翻译服务暂时不可用。");
  } finally {
    btnEl.innerText = originalText;
    btnEl.disabled = false;
  }
}

// 历史记录
function getHistory() {
  let history = localStorage.getItem("searchHistory");
  return history ? JSON.parse(history) : [];
}

function saveHistory(keyword) {
  if (!keyword) return;
  let history = getHistory();
  history = history.filter(item => item !== keyword);
  history.unshift(keyword);
  if (history.length > 10) {
    history.pop();
  }
  localStorage.setItem("searchHistory", JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  let history = getHistory();
  let container = document.getElementById("history-tags");
  container.innerHTML = "";
  
  if (history.length === 0) {
    container.innerHTML = "<span class='empty-history'>暂无搜索记录</span>";
    return;
  }
  
  history.forEach(keyword => {
    let span = document.createElement("span");
    span.className = "history-tag";
    span.textContent = keyword;
    span.onclick = function() {
      document.getElementById("keyword").value = keyword;
    };
    container.appendChild(span);
  });
}

function clearHistory() {
  localStorage.removeItem("searchHistory");
  renderHistory();
}

// 页面加载 + 回车搜索
window.onload = function(){
  renderHistory();
  
  document.getElementById('keyword').addEventListener('keydown', function(e){
    if(e.key === 'Enter') search();
  })
};

// 构建链接
function buildUrl(engineKey) {
  let keyword = document.getElementById("keyword").value.trim();
  if (!keyword) {
    alert("请输入关键词");
    return "";
  }
  return engines[engineKey].replace("（关键词）", encodeURIComponent(keyword));
}

// 单站搜索
function search() {
  let keyword = document.getElementById("keyword").value.trim();
  let engine = document.getElementById("engine").value;
  let url = buildUrl(engine);
  if (url) {
    saveHistory(keyword); 
    document.getElementById("result").value = url;
    window.open(url);
  }
}

// 多站点搜索：一次性打开全部网站
function searchAll() {
  let keyword = document.getElementById("keyword").value.trim();
  if (!keyword) {
    alert("请输入关键词");
    return;
  }
  
  saveHistory(keyword); 

  Object.keys(engines).forEach(engine => {
    let url = buildUrl(engine);
    if(url) window.open(url);
  });
}

// 复制链接
function copyLink() {
  let engine = document.getElementById("engine").value;
  let url = buildUrl(engine);
  if (url) {
    document.getElementById("result").value = url;
    navigator.clipboard.writeText(url);
    alert("已复制链接至剪贴板！");
  }
}

</script>
</body>
</html>
